app:
  network:
    wg-host: 10.10.10.1

slot:
  catalog:
    path: classpath:slot/slot.json
  summary:
    path: classpath:slot/mcp_final_summary.json

spring:
  config:
    import:
      - optional:file:./shared-config/zhipu-common.yml
      - optional:file:../shared-config/zhipu-common.yml
  application:
    name: agent-engine
  datasource:
    url: jdbc:postgresql://${app.network.wg-host}:5432/postgres?connectTimeout=5&socketTimeout=60&tcpKeepAlive=true
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AgentEngineHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 250000
      max-lifetime: 300000
      connection-timeout: 500
      validation-timeout: 2000
  data:
    redis:
      host: ${app.network.wg-host}
      port: 6379
      password: 123456
      connect-timeout: 300ms
      timeout: 500ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2
          max-wait: 300ms
          time-between-eviction-runs: 20s
logging:
  level:
    root: info
    com.agentengine: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/agent-engine.log

skill:
  preprocess:
    install-lock-key-prefix: "skill:install:lock:"
    redis-tool-count-key-pattern: "tool:*:count"
    redis-scan-count-hint: 50
    redis-script-batch-size: 50
    daily-stat-cron: 0 0 3 * * *

xxl:
  job:
    admin:
      addresses: http://${app.network.wg-host}:8080/xxl-job-admin
    access-token: 123456
    executor:
      appname: agent-engine
      address:
      ip: 10.10.10.2
      port: 10002
      log-path: ./logs/xxl-job
      log-retention-days: 7

agent:
  assistant:
    intent-slot-whitelist:
      path: dataset/assistant_intent_slot_whitelist.json
    tool-http:
      timeout-ms: 30000
      executor:
        size: 16
      flow:
        rate-limit-enabled: true
        qps: 120
        circuit-breaker-enabled: true
        failure-rate-threshold: 0.5
      retry:
        max-retry: 3
        topic: assistant_tool_retry_tasks
        consumer:
          topic: assistant_tool_retry_tasks
          group: assistant-tool-retry-consumer
        producer:
          send-timeout-ms: 3000
          retry-delay-levels: 1,2,3
          publish-retry-max-attempts: 3
          publish-retry-sleep-ms: 200
    mcp-auth:
      default-mode: header
      query-mode-skill-names: dream-interpretation
      query-param-name: Authorization

rocketmq:
  name-server: ${app.network.wg-host}:9876
