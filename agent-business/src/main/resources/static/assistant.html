<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能助手</title>
  <style>
    :root { --line:#dbe4ef; --text:#0f172a; --muted:#607086; --bg:#0f2f4a; --bg2:#1e75ad; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color: var(--text);
      background: linear-gradient(120deg,var(--bg),var(--bg2));
    }
    .app {
      max-width: 1100px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
    }
    .main, .side {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(4,28,45,.25);
      overflow: hidden;
    }
    .head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title { font-size: 20px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 12px; }
    .chat {
      height: 560px;
      overflow: auto;
      padding: 14px;
      background: #f7fbff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      border-radius: 10px;
      padding: 10px 12px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 13px;
    }
    .user { align-self: flex-end; background: #0ea5a0; color: #fff; }
    .assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
    .input-wrap {
      border-top: 1px solid var(--line);
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #fff;
    }
    textarea {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      min-height: 70px;
      max-height: 180px;
      padding: 10px;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .send { background: linear-gradient(135deg,#0ea5a0,#0f766e); }
    .back { background: linear-gradient(135deg,#64748b,#475569); }
    .new { background: linear-gradient(135deg,#2563eb,#1d4ed8); }
    .side-body { padding: 14px; display: grid; gap: 10px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #f8fbff; }
    .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .v { font-size: 13px; font-weight: 700; word-break: break-all; }
    .status { border-left: 4px solid #2563eb; }
    .tips { font-size: 12px; color: var(--muted); line-height: 1.5; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .chat { height: 420px; }
    }
  </style>
</head>
<body>
<div class="app">
  <section class="main">
    <div class="head">
      <div>
        <div class="title">智能助手</div>
        <div class="sub">前端生成 taskId，后端仅生成 traceId；每次消息触发槽位提取 + embedding</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="new" id="newTaskBtn">新会话</button>
        <button class="back" onclick="location.href='/'">返回首页</button>
      </div>
    </div>
    <div id="chatBox" class="chat"></div>
    <div class="input-wrap">
      <textarea id="input" placeholder="请输入你的问题..."></textarea>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </section>

  <aside class="side">
    <div class="head"><div class="title" style="font-size:16px;">会话状态</div></div>
    <div class="side-body">
      <div class="card"><div class="k">userId</div><div id="userId" class="v">-</div></div>
      <div class="card"><div class="k">taskId</div><div id="taskId" class="v">-</div></div>
      <div class="card"><div class="k">traceId</div><div id="traceId" class="v">-</div></div>
      <div class="card"><div class="k">state</div><div id="state" class="v">-</div></div>
      <div class="card"><div class="k">missingSlots</div><div id="missingSlots" class="v">[]</div></div>
      <div class="card"><div class="k">lastTool</div><div id="lastTool" class="v">-</div></div>
      <div class="card"><div class="k">embeddingDim</div><div id="embDim" class="v">0</div></div>
      <div class="card status"><div class="k">状态</div><div id="status" class="v">就绪</div></div>
      <div class="tips">后端 Redis 仅保留最近 3 轮原始对话（6 条消息：user+assistant）。</div>
    </div>
  </aside>
</div>

<script>
const API = '/api/assistant/state/execute';
const $ = (id) => document.getElementById(id);

function rid() {
  return (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`).replace(/-/g, '');
}

function getOrCreateUserId() {
  let userId = localStorage.getItem('assistant_user_id');
  if (!userId) {
    userId = rid();
    localStorage.setItem('assistant_user_id', userId);
  }
  return userId;
}

function getOrCreateTaskId() {
  let taskId = sessionStorage.getItem('assistant_task_id');
  if (!taskId) {
    taskId = rid();
    sessionStorage.setItem('assistant_task_id', taskId);
  }
  return taskId;
}

let userId = getOrCreateUserId();
let taskId = getOrCreateTaskId();

function refreshIds() {
  $('userId').textContent = userId;
  $('taskId').textContent = taskId;
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  $('chatBox').appendChild(div);
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}

function setStatus(text) {
  $('status').textContent = text;
}

function renderState(s) {
  $('traceId').textContent = s.traceId || '-';
  $('state').textContent = s.state || '-';
  $('missingSlots').textContent = JSON.stringify(s.missingSlots || []);
  $('lastTool').textContent = s.lastToolName || '-';
  $('embDim').textContent = String(s.lastEmbeddingDim || 0);
}

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  addMsg('user', text);
  setStatus('处理中...');
  $('sendBtn').disabled = true;
  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        userId,
        taskId,
        message: text
      })
    });
    const data = await resp.json();
    if (!resp.ok) {
      addMsg('assistant', `请求失败: ${data.error || resp.status}`);
      setStatus('失败');
      return;
    }
    renderState(data);
    const desc = [
      `state=${data.state || '-'}`,
      `tool=${data.lastToolName || '-'}`,
      `missingSlots=${JSON.stringify(data.missingSlots || [])}`,
      `embeddingDim=${data.lastEmbeddingDim || 0}`
    ].join('\n');
    addMsg('assistant', desc);
    setStatus('完成');
  } catch (e) {
    addMsg('assistant', `请求异常: ${e.message || e}`);
    setStatus('异常');
  } finally {
    $('sendBtn').disabled = false;
  }
}

$('sendBtn').addEventListener('click', send);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$('newTaskBtn').addEventListener('click', () => {
  taskId = rid();
  sessionStorage.setItem('assistant_task_id', taskId);
  refreshIds();
  $('traceId').textContent = '-';
  $('state').textContent = '-';
  $('missingSlots').textContent = '[]';
  $('lastTool').textContent = '-';
  $('embDim').textContent = '0';
  $('chatBox').innerHTML = '';
  addMsg('assistant', '已创建新会话，请继续输入。');
});

refreshIds();
addMsg('assistant', '欢迎使用智能助手，请输入你的问题。');
</script>
</body>
</html>
