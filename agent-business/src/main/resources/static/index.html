<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Engine 首页</title>
  <style>
    :root { --line:#dbe4ef; --text:#0f172a; --muted:#607086; }
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(120deg,#0f2f4a,#1e75ad)}
    .app{max-width:900px;margin:60px auto;background:#fff;border-radius:16px;box-shadow:0 14px 44px rgba(4,28,45,.25);padding:28px}
    h1{margin:0 0 8px;font-size:28px}
    .sub{color:var(--muted);margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px}
    .card{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}
    .title{font-size:18px;font-weight:700}
    .desc{font-size:13px;color:var(--muted);line-height:1.5}
    button{border:none;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer}
    .main{background:linear-gradient(135deg,#0ea5a0,#0f766e);color:#fff}
    .ops{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <h1>Agent Engine</h1>
  <div class="sub">请选择入口：业务功能在主模块，容器初始化在独立的 agent-ops 模块。</div>
  <div class="grid">
    <div class="card">
      <div class="title">智能助手</div>
      <div class="desc">进入 agent-business 主链路入口，后续在该页承接对话与工具调用。</div>
      <button class="main" onclick="location.href='/assistant'">进入智能助手</button>
    </div>
    <div class="card">
      <div class="title">Embedding 运维</div>
      <div class="desc">技能/工具 embedding 已迁移到 agent-ops。</div>
      <button class="ops" onclick="window.open('http://' + location.hostname + ':18080/skill-add.html','_blank')">打开 Embedding 页面</button>
    </div>
    <div class="card">
      <div class="title">运维模块</div>
      <div class="desc">请先启动 agent-ops（默认 18080），再执行容器初始化。</div>
      <button class="ops" onclick="window.open('http://localhost:18080','_blank')">打开 agent-ops</button>
    </div>
  </div>
</div>
</body>
</html>
