<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>运维</title>
  <style>
    :root { --line:#dbe4ef; --text:#0f172a; --muted:#607086; --ok:#059669; --err:#dc2626; }
    *{box-sizing:border-box}
    body{margin:0;padding:20px;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(120deg,#0f2f4a,#1e75ad)}
    .app{max-width:900px;margin:60px auto;background:#fff;border-radius:16px;box-shadow:0 14px 44px rgba(4,28,45,.25);padding:24px}
    h1{margin:0 0 8px;font-size:24px}
    .sub{color:var(--muted);margin-bottom:18px;font-size:13px}
    .status{border:1px solid var(--line);background:#f8fbff;border-radius:10px;padding:10px 12px;font-size:13px;min-height:40px}
    .status.ok{border-color:#bbf7d0;background:#f0fdf4;color:var(--ok)}
    .status.err{border-color:#fecaca;background:#fef2f2;color:var(--err)}
    .btns{display:flex;gap:10px;margin-top:14px}
    button{border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
    .b-main{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
    .b-back{background:linear-gradient(135deg,#64748b,#475569);color:#fff}
    .panel{margin-top:14px;min-height:180px;border:1px solid #1f2c3f;border-radius:12px;background:#0d1625;color:#dce8ff;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;overflow:auto}
  </style>
</head>
<body>
<div class="app">
  <h1>运维</h1>
  <div class="sub">本页仅负责技能表结构初始化。Docker 容器初始化请先启动 agent-ops 模块并调用其接口。</div>
  <div id="status" class="status">等待操作</div>
  <div class="btns">
    <button class="b-main" id="initBtn">初始化技能表结构</button>
    <button class="b-back" onclick="location.href='/'">返回首页</button>
  </div>
  <div id="resultPanel" class="panel">{"message":"运维结果在这里"}</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function setStatus(t, type=''){ const n=$('status'); n.textContent=t; n.className=`status ${type}`.trim(); }
function j(x){ try{return JSON.stringify(x,null,2)}catch(e){return String(x)} }
let running = false;
let lastClickTs = 0;
const CLICK_DEBOUNCE_MS = 800;

async function initSchema(){
  const now = Date.now();
  if (now - lastClickTs < CLICK_DEBOUNCE_MS) return;
  lastClickTs = now;
  if (running) return;

  running = true;
  $('initBtn').disabled = true;
  setStatus('执行中...');
  try {
    const resp = await fetch('/api/ops/schema/skill/init', { method: 'POST' });
    const data = await resp.json();
    if(!resp.ok){ throw new Error(data.message || `HTTP ${resp.status}`); }
    $('resultPanel').textContent = j(data);
    setStatus('执行完成', 'ok');
  } catch (e) {
    $('resultPanel').textContent = j({error: e.message || String(e)});
    setStatus(`执行失败: ${e.message || e}`, 'err');
  } finally {
    running = false;
    $('initBtn').disabled = false;
  }
}

$('initBtn').addEventListener('click', initSchema);
</script>
</body>
</html>
