zhipu:
  api-key: ${zhipukey:}
  base-url: https://open.bigmodel.cn/api/paas/v4
  discovery-model: glm-4-flash
  semantic-model: glm-4.5
  label-model: glm-4-flash
  slot-model: glm-4-flash
  embedding-model: embedding-3
  connect-timeout-ms: 2000
  request-timeout-ms: 15000
  discovery-max-inflight: 4
  semantic-max-inflight: 6
  label-max-inflight: 3
  slot-max-inflight: 3
  embedding-max-inflight: 8
  discovery-qps: 4
  semantic-qps: 3
  label-qps: 4
  slot-qps: 4
  embedding-qps: 8
  qps-limiter-enabled: true
  circuit-breaker-enabled: true
  failure-rate-threshold: 0.5
  discovery-failure-rate-threshold: 0.6
  semantic-failure-rate-threshold: 0.55
  label-failure-rate-threshold: 0.6
  slot-failure-rate-threshold: 0.6
  embedding-failure-rate-threshold: 0.5
  model-acquire-timeout-ms: 0
  breaker-failure-threshold: 3
  breaker-open-ms: 30000

thread-pool:
  llm:
    discovery:
      core-size: 2
    semantic:
      core-size: 3
    embedding:
      core-size: 6
    label:
      core-size: 2
    slot:
      core-size: 3
  pg-io:
    core-cpu-ratio: 0.75
    daemon: false
    reject-policy: degrade
  redis-io:
    # 仅用于定时任务（如技能热度统计）中的 Redis 批量/扫描操作。
    # 在线请求链路不要使用该线程池，避免额外排队与时延放大。
    core-cpu-ratio: 0.5
    daemon: false
    reject-policy: degrade

agent:
  http:
    llm:
      default-connect-timeout-ms: ${zhipu.connect-timeout-ms:2000}
      default-executor-threads: 8
      default-model: ${zhipu.discovery-model:glm-4-flash}
      pools:
        glm-4-flash:
          connect-timeout-ms: ${zhipu.connect-timeout-ms:2000}
          executor-threads: ${zhipu.discovery-max-inflight:4}
        "glm-4.5":
          connect-timeout-ms: ${zhipu.connect-timeout-ms:2000}
          executor-threads: ${zhipu.semantic-max-inflight:6}
        embedding-3:
          connect-timeout-ms: ${zhipu.connect-timeout-ms:2000}
          executor-threads: ${zhipu.embedding-max-inflight:8}

  log:
    kafka:
      producer:
        enabled: false
        topic: agent.log.events
        app-name: ${spring.application.name:agent-engine}
        module-name: ${spring.application.name:agent-engine}
        env-name: ${app.env:dev}

spring:
  kafka:
    bootstrap-servers: ${app.network.wg-host:10.10.10.1}:9092
    producer:
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
